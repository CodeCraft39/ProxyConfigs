#
# Deploy a local HTTP server and use JavaScript for data processing.
# If require-devices is set, this configuration will only be loaded when the current Quantumult X device ID matches.
# The Quantumult device ID can be found in Settings - Misc Settings - About.
# The input variables are $request.url, $request.path, $request.headers, $request.body.
# The output uses $done({status:"HTTP/1.1 200 OK", headers:{}, body:"here is a string"}) to send an HTTP response.
# You can use a signature or another validation method to verify requests.
# Local endpoint prefix: http://127.0.0.1:9999/icloud-profile/
# Append the file path relative to iCloud Drive/Quantumult X/Data/.
# The upstream backend hardcodes /icloud-profile/; keep this route prefix unchanged.
#
[http_backend]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/backend-icloud-to-http.js, tag=iCloud File Server, path=^/icloud-profile/


#
# Important: Always keep your CA passphrase and p12 private.
#
[mitm]
skip_validating_cert = false
hostname = g.cn, *.g.cn, google.cn, *.google.cn